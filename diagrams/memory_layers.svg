<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#388bfd"/>
    </marker>
    <marker id="arrowMO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f0883e"/>
    </marker>
    <marker id="arrowMG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#56d364"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="url(#bg4)" rx="12"/>
  <rect width="720" height="440" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold" letter-spacing="3">CDRS — MEMORY ARCHITECTURE</text>
  <text x="360" y="50" text-anchor="middle" fill="#8b949e" font-size="10" letter-spacing="1">From context window → session memory → cross-session pattern consolidation</text>
  <line x1="30" y1="60" x2="690" y2="60" stroke="#21262d" stroke-width="1"/>

  <!-- Level labels on left -->
  <text x="20" y="135" fill="#484f58" font-size="8" text-anchor="middle" transform="rotate(-90 20 135)">SINGLE SESSION</text>
  <text x="20" y="265" fill="#484f58" font-size="8" text-anchor="middle" transform="rotate(-90 20 265)">CROSS-SESSION</text>
  <text x="20" y="380" fill="#484f58" font-size="8" text-anchor="middle" transform="rotate(-90 20 380)">PATTERN LAYER</text>
  <line x1="30" y1="70" x2="30" y2="430" stroke="#21262d" stroke-width="1"/>

  <!-- === LEVEL 1: Conversations === -->
  <!-- Session boxes -->
  <rect x="45" y="76" width="128" height="72" rx="6" fill="#1c2128" stroke="#388bfd" stroke-width="1"/>
  <text x="109" y="96" text-anchor="middle" fill="#79c0ff" font-size="9" font-weight="bold">Session 1</text>
  <text x="109" y="110" text-anchor="middle" fill="#8b949e" font-size="8">constraints + actions</text>
  <text x="109" y="122" text-anchor="middle" fill="#8b949e" font-size="8">outcomes + risks</text>
  <text x="109" y="134" text-anchor="middle" fill="#8b949e" font-size="8">WHY + confidence</text>
  <text x="109" y="145" text-anchor="middle" fill="#484f58" font-size="8">context window</text>

  <rect x="187" y="76" width="128" height="72" rx="6" fill="#1c2128" stroke="#388bfd" stroke-width="1"/>
  <text x="251" y="96" text-anchor="middle" fill="#79c0ff" font-size="9" font-weight="bold">Session 2</text>
  <text x="251" y="110" text-anchor="middle" fill="#8b949e" font-size="8">constraints + actions</text>
  <text x="251" y="122" text-anchor="middle" fill="#8b949e" font-size="8">outcomes + risks</text>
  <text x="251" y="134" text-anchor="middle" fill="#8b949e" font-size="8">WHY + confidence</text>
  <text x="251" y="145" text-anchor="middle" fill="#484f58" font-size="8">context window</text>

  <rect x="329" y="76" width="128" height="72" rx="6" fill="#1c2128" stroke="#388bfd" stroke-width="1"/>
  <text x="393" y="96" text-anchor="middle" fill="#79c0ff" font-size="9" font-weight="bold">Session 3</text>
  <text x="393" y="110" text-anchor="middle" fill="#8b949e" font-size="8">constraints + actions</text>
  <text x="393" y="122" text-anchor="middle" fill="#8b949e" font-size="8">outcomes + risks</text>
  <text x="393" y="134" text-anchor="middle" fill="#8b949e" font-size="8">WHY + confidence</text>
  <text x="393" y="145" text-anchor="middle" fill="#484f58" font-size="8">context window</text>

  <text x="490" y="108" fill="#484f58" font-size="20" text-anchor="middle">···</text>

  <rect x="530" y="76" width="160" height="72" rx="6" fill="#1c2128" stroke="#388bfd" stroke-width="1"/>
  <text x="610" y="96" text-anchor="middle" fill="#79c0ff" font-size="9" font-weight="bold">Session N</text>
  <text x="610" y="110" text-anchor="middle" fill="#8b949e" font-size="8">constraints + actions</text>
  <text x="610" y="122" text-anchor="middle" fill="#8b949e" font-size="8">outcomes + risks</text>
  <text x="610" y="134" text-anchor="middle" fill="#8b949e" font-size="8">WHY + confidence</text>
  <text x="610" y="145" text-anchor="middle" fill="#484f58" font-size="8">context window</text>

  <!-- Arrows down to ExperienceStore -->
  <line x1="109" y1="148" x2="109" y2="178" stroke="#388bfd" stroke-width="1.2" marker-end="url(#arrowM)"/>
  <line x1="251" y1="148" x2="251" y2="178" stroke="#388bfd" stroke-width="1.2" marker-end="url(#arrowM)"/>
  <line x1="393" y1="148" x2="393" y2="178" stroke="#388bfd" stroke-width="1.2" marker-end="url(#arrowM)"/>
  <line x1="610" y1="148" x2="610" y2="178" stroke="#388bfd" stroke-width="1.2" marker-end="url(#arrowM)"/>

  <!-- Save label -->
  <text x="200" y="170" fill="#484f58" font-size="8">save()</text>

  <!-- === LEVEL 2: ExperienceStore === -->
  <rect x="45" y="182" width="645" height="60" rx="6" fill="#0e2d44" stroke="#388bfd" stroke-width="1.5"/>
  <text x="368" y="206" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="bold">ExperienceStore  (experience_store.py)</text>
  <text x="368" y="224" text-anchor="middle" fill="#8b949e" font-size="9">JSON-persistent · one record per decision · constraints + action + expected/actual outcome + confidence + result</text>
  <text x="368" y="237" text-anchor="middle" fill="#484f58" font-size="8">prototype/memory/experiences.json</text>

  <!-- Arrow down to PatternStore -->
  <line x1="368" y1="242" x2="368" y2="278" stroke="#f0883e" stroke-width="2" marker-end="url(#arrowMO)" stroke-dasharray="6,3"/>
  <text x="420" y="265" fill="#f0883e" font-size="8.5">consolidate()  ← scheduled process</text>
  <text x="420" y="277" fill="#484f58" font-size="8">(the dreaming layer)</text>

  <!-- === LEVEL 3: PatternStore === -->
  <rect x="45" y="282" width="645" height="70" rx="6" fill="#1a3a00" stroke="#56d364" stroke-width="1.5"/>
  <rect x="45" y="282" width="645" height="70" rx="6" fill="#56d364" opacity="0.05"/>
  <text x="368" y="306" text-anchor="middle" fill="#56d364" font-size="11" font-weight="bold">PatternStore  (pattern_store.py)</text>
  <text x="368" y="322" text-anchor="middle" fill="#8b949e" font-size="9">Cross-session consolidation · constraint signature → recommended action + success rate + avg confidence</text>
  <text x="368" y="338" text-anchor="middle" fill="#8b949e" font-size="9">Extracts: recurring failures · consistently successful workflows · constraint configurations that predict outcomes</text>
  <text x="368" y="350" text-anchor="middle" fill="#484f58" font-size="8">prototype/memory/patterns.json</text>

  <!-- Arrow back up (retrieval) -->
  <path d="M45,290 Q20,290 20,230 Q20,170 45,170" fill="none" stroke="#56d364" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="45,166 37,174 53,174" fill="#56d364"/>
  <text x="16" y="235" fill="#56d364" font-size="8" text-anchor="middle" transform="rotate(-90 16 235)">lookup()</text>

  <!-- Human analogy row -->
  <line x1="30" y1="368" x2="690" y2="368" stroke="#21262d" stroke-width="1"/>
  <text x="80" y="386" fill="#484f58" font-size="9" font-weight="bold">HUMAN ANALOGY</text>

  <rect x="45" y="394" width="190" height="32" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="140" y="414" text-anchor="middle" fill="#484f58" font-size="9">Working memory (per task)</text>

  <rect x="255" y="394" width="190" height="32" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="350" y="414" text-anchor="middle" fill="#484f58" font-size="9">Episodic memory (events)</text>

  <rect x="465" y="394" width="210" height="32" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="570" y="414" text-anchor="middle" fill="#56d364" font-size="9">Semantic memory (patterns) ← sleep</text>

  <text x="360" y="435" text-anchor="middle" fill="#484f58" font-size="9">CDRS · Sami Ahmed Yusuf Kolarkar · 2026 · Apache 2.0</text>
</svg>
