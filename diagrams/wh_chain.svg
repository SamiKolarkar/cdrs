<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowWH" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="780" height="320" fill="url(#bg3)" rx="12"/>
  <rect width="780" height="320" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- Title -->
  <text x="390" y="32" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold" letter-spacing="3">WH-QUESTION CHAIN</text>
  <text x="390" y="50" text-anchor="middle" fill="#8b949e" font-size="10" letter-spacing="1">Structured goal interrogation before action selection · HOW is always last</text>
  <line x1="30" y1="60" x2="750" y2="60" stroke="#21262d" stroke-width="1"/>

  <!-- Input -->
  <rect x="30" y="80" width="90" height="52" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="75" y="102" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="bold">INPUT</text>
  <text x="75" y="117" text-anchor="middle" fill="#8b949e" font-size="8">goal +</text>
  <text x="75" y="128" text-anchor="middle" fill="#8b949e" font-size="8">constraints</text>
  <line x1="120" y1="106" x2="138" y2="106" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowWH)"/>

  <!-- WHY node -->
  <rect x="140" y="80" width="82" height="52" rx="8" fill="#1f4e79" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="181" y="100" text-anchor="middle" fill="#cdd9e5" font-size="11" font-weight="bold">WHY?</text>
  <text x="181" y="116" text-anchor="middle" fill="#8b949e" font-size="8">intent /</text>
  <text x="181" y="127" text-anchor="middle" fill="#8b949e" font-size="8">purpose</text>
  <line x1="222" y1="106" x2="240" y2="106" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowWH)"/>

  <!-- WHAT node -->
  <rect x="242" y="80" width="82" height="52" rx="8" fill="#0e3d5c" stroke="#79c0ff" stroke-width="1"/>
  <text x="283" y="100" text-anchor="middle" fill="#cdd9e5" font-size="11" font-weight="bold">WHAT?</text>
  <text x="283" y="116" text-anchor="middle" fill="#8b949e" font-size="8">required</text>
  <text x="283" y="127" text-anchor="middle" fill="#8b949e" font-size="8">outcomes</text>
  <line x1="324" y1="106" x2="342" y2="106" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowWH)"/>

  <!-- WHO node -->
  <rect x="344" y="80" width="82" height="52" rx="8" fill="#0e3d5c" stroke="#79c0ff" stroke-width="1"/>
  <text x="385" y="100" text-anchor="middle" fill="#cdd9e5" font-size="11" font-weight="bold">WHO?</text>
  <text x="385" y="116" text-anchor="middle" fill="#8b949e" font-size="8">entities /</text>
  <text x="385" y="127" text-anchor="middle" fill="#8b949e" font-size="8">resources</text>
  <line x1="426" y1="106" x2="444" y2="106" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowWH)"/>

  <!-- WHEN node -->
  <rect x="446" y="80" width="82" height="52" rx="8" fill="#0e3d5c" stroke="#79c0ff" stroke-width="1"/>
  <text x="487" y="100" text-anchor="middle" fill="#cdd9e5" font-size="11" font-weight="bold">WHEN?</text>
  <text x="487" y="116" text-anchor="middle" fill="#8b949e" font-size="8">conditions /</text>
  <text x="487" y="127" text-anchor="middle" fill="#8b949e" font-size="8">timing</text>
  <line x1="528" y1="106" x2="546" y2="106" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowWH)"/>

  <!-- WHERE node -->
  <rect x="548" y="80" width="82" height="52" rx="8" fill="#0e3d5c" stroke="#79c0ff" stroke-width="1"/>
  <text x="589" y="100" text-anchor="middle" fill="#cdd9e5" font-size="11" font-weight="bold">WHERE?</text>
  <text x="589" y="116" text-anchor="middle" fill="#8b949e" font-size="8">environment /</text>
  <text x="589" y="127" text-anchor="middle" fill="#8b949e" font-size="8">context</text>
  <line x1="630" y1="106" x2="648" y2="106" stroke="#f0883e" stroke-width="2" marker-end="url(#arrowWH)"/>

  <!-- HOW node - highlighted as output -->
  <rect x="650" y="72" width="96" height="68" rx="8" fill="#1a3a00" stroke="#56d364" stroke-width="2"/>
  <rect x="650" y="72" width="96" height="68" rx="8" fill="#56d364" opacity="0.08"/>
  <text x="698" y="97" text-anchor="middle" fill="#56d364" font-size="13" font-weight="bold">HOW?</text>
  <text x="698" y="113" text-anchor="middle" fill="#8b949e" font-size="8">execution</text>
  <text x="698" y="124" text-anchor="middle" fill="#8b949e" font-size="8">strategy</text>
  <text x="698" y="135" text-anchor="middle" fill="#56d364" font-size="8" font-weight="bold">← ALWAYS LAST</text>

  <!-- Labels below nodes -->
  <text x="181" y="152" text-anchor="middle" fill="#484f58" font-size="8">Start here</text>
  <text x="698" y="158" text-anchor="middle" fill="#56d364" font-size="8">Output of reasoning</text>

  <!-- Divider -->
  <line x1="30" y1="172" x2="750" y2="172" stroke="#21262d" stroke-width="1"/>

  <!-- Multi-WHY section -->
  <text x="390" y="194" text-anchor="middle" fill="#ffa657" font-size="11" font-weight="bold" letter-spacing="2">MULTI-WHY BALANCE</text>
  <text x="390" y="210" text-anchor="middle" fill="#8b949e" font-size="9">Real decisions combine four WHY types simultaneously, weighted by constraint priorities</text>

  <!-- Four WHY types -->
  <rect x="40" y="224" width="155" height="60" rx="6" fill="#1c2128" stroke="#56d364" stroke-width="1"/>
  <text x="118" y="244" text-anchor="middle" fill="#56d364" font-size="10" font-weight="bold">benefit_why</text>
  <text x="118" y="260" text-anchor="middle" fill="#8b949e" font-size="8.5">Why this action</text>
  <text x="118" y="273" text-anchor="middle" fill="#8b949e" font-size="8.5">produces value</text>

  <rect x="210" y="224" width="155" height="60" rx="6" fill="#1c2128" stroke="#ff7b72" stroke-width="1"/>
  <text x="288" y="244" text-anchor="middle" fill="#ff7b72" font-size="10" font-weight="bold">risk_why</text>
  <text x="288" y="260" text-anchor="middle" fill="#8b949e" font-size="8.5">Why this action</text>
  <text x="288" y="273" text-anchor="middle" fill="#8b949e" font-size="8.5">could fail</text>

  <rect x="380" y="224" width="155" height="60" rx="6" fill="#1c2128" stroke="#79c0ff" stroke-width="1"/>
  <text x="458" y="244" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="bold">condition_why</text>
  <text x="458" y="260" text-anchor="middle" fill="#8b949e" font-size="8.5">When this action</text>
  <text x="458" y="273" text-anchor="middle" fill="#8b949e" font-size="8.5">is valid</text>

  <rect x="550" y="224" width="180" height="60" rx="6" fill="#1c2128" stroke="#d2a8ff" stroke-width="1"/>
  <text x="640" y="244" text-anchor="middle" fill="#d2a8ff" font-size="10" font-weight="bold">failure_why</text>
  <text x="640" y="260" text-anchor="middle" fill="#8b949e" font-size="8.5">When this action</text>
  <text x="640" y="273" text-anchor="middle" fill="#8b949e" font-size="8.5">becomes dangerous</text>

  <!-- Arrows pointing to center -->
  <line x1="195" y1="254" x2="210" y2="254" stroke="#388bfd" stroke-width="1" marker-end="url(#arrowWH)"/>
  <line x1="365" y1="254" x2="380" y2="254" stroke="#388bfd" stroke-width="1" marker-end="url(#arrowWH)"/>
  <line x1="535" y1="254" x2="550" y2="254" stroke="#388bfd" stroke-width="1" marker-end="url(#arrowWH)"/>

  <text x="390" y="310" text-anchor="middle" fill="#484f58" font-size="9">CDRS · Sami Ahmed Yusuf Kolarkar · 2026 · Apache 2.0</text>
</svg>
