<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="benefitGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a4731"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="riskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a1e1e"/>
      <stop offset="100%" stop-color="#b94040"/>
    </linearGradient>
    <linearGradient id="condGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b2e0d"/>
      <stop offset="100%" stop-color="#9a7c2a"/>
    </linearGradient>
    <linearGradient id="failGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d1a4a"/>
      <stop offset="100%" stop-color="#7c4dbb"/>
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f4e79"/>
      <stop offset="100%" stop-color="#2e75b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="520" fill="url(#bg)" rx="12"/>
  <rect width="760" height="520" fill="none" stroke="#30363d" stroke-width="1" rx="12"/>

  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold" letter-spacing="3" filter="url(#glow)">WHY COMPOSITION</text>
  <text x="380" y="54" text-anchor="middle" fill="#8b949e" font-size="10" letter-spacing="1">Dynamic construction from four reasoning types · Never stored as a fixed answer</text>
  <line x1="60" y1="64" x2="700" y2="64" stroke="#21262d" stroke-width="1"/>

  <!-- Formula -->
  <rect x="180" y="76" width="400" height="32" fill="#161b22" rx="6" stroke="#30363d" stroke-width="1"/>
  <text x="380" y="97" text-anchor="middle" fill="#e6edf3" font-size="12" letter-spacing="1">WHY = f( outcomes, constraints, risks, goals, timing )</text>

  <!-- Four WHY type boxes -->
  <!-- Benefit WHY -->
  <rect x="40" y="134" width="155" height="130" fill="url(#benefitGrad)" rx="8" stroke="#2ea043" stroke-width="1.5" opacity="0.9"/>
  <text x="117" y="158" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" letter-spacing="1">BENEFIT WHY</text>
  <line x1="55" y1="165" x2="180" y2="165" stroke="#2ea043" stroke-width="0.8" opacity="0.6"/>
  <text x="117" y="182" text-anchor="middle" fill="#c3e6cb" font-size="9.5">Why this action</text>
  <text x="117" y="196" text-anchor="middle" fill="#c3e6cb" font-size="9.5">produces value</text>
  <text x="117" y="218" text-anchor="middle" fill="#acd4b0" font-size="9">outcome_score +</text>
  <text x="117" y="232" text-anchor="middle" fill="#acd4b0" font-size="9">goal + context</text>
  <text x="117" y="252" text-anchor="middle" fill="#7ec88a" font-size="9" font-style="italic">→ benefit score</text>

  <!-- Risk WHY -->
  <rect x="210" y="134" width="155" height="130" fill="url(#riskGrad)" rx="8" stroke="#b94040" stroke-width="1.5" opacity="0.9"/>
  <text x="287" y="158" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" letter-spacing="1">RISK WHY</text>
  <line x1="225" y1="165" x2="350" y2="165" stroke="#b94040" stroke-width="0.8" opacity="0.6"/>
  <text x="287" y="182" text-anchor="middle" fill="#f5c6c6" font-size="9.5">Why this action</text>
  <text x="287" y="196" text-anchor="middle" fill="#f5c6c6" font-size="9.5">could fail or harm</text>
  <text x="287" y="218" text-anchor="middle" fill="#ebb8b8" font-size="9">risk_probability +</text>
  <text x="287" y="232" text-anchor="middle" fill="#ebb8b8" font-size="9">constraint context</text>
  <text x="287" y="252" text-anchor="middle" fill="#e08080" font-size="9" font-style="italic">→ risk penalty</text>

  <!-- Condition WHY -->
  <rect x="380" y="134" width="155" height="130" fill="url(#condGrad)" rx="8" stroke="#9a7c2a" stroke-width="1.5" opacity="0.9"/>
  <text x="457" y="158" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" letter-spacing="1">CONDITION WHY</text>
  <line x1="395" y1="165" x2="520" y2="165" stroke="#9a7c2a" stroke-width="0.8" opacity="0.6"/>
  <text x="457" y="182" text-anchor="middle" fill="#f0dba0" font-size="9.5">When this action</text>
  <text x="457" y="196" text-anchor="middle" fill="#f0dba0" font-size="9.5">is valid to execute</text>
  <text x="457" y="218" text-anchor="middle" fill="#d4c080" font-size="9">high-priority</text>
  <text x="457" y="232" text-anchor="middle" fill="#d4c080" font-size="9">constraints</text>
  <text x="457" y="252" text-anchor="middle" fill="#c8a840" font-size="9" font-style="italic">→ validity gate</text>

  <!-- Failure WHY -->
  <rect x="550" y="134" width="155" height="130" fill="url(#failGrad)" rx="8" stroke="#7c4dbb" stroke-width="1.5" opacity="0.9"/>
  <text x="627" y="158" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold" letter-spacing="1">FAILURE WHY</text>
  <line x1="565" y1="165" x2="690" y2="165" stroke="#7c4dbb" stroke-width="0.8" opacity="0.6"/>
  <text x="627" y="182" text-anchor="middle" fill="#d4b8f5" font-size="9.5">When this action</text>
  <text x="627" y="196" text-anchor="middle" fill="#d4b8f5" font-size="9.5">becomes dangerous</text>
  <text x="627" y="218" text-anchor="middle" fill="#c0a0e8" font-size="9">failure_conditions</text>
  <text x="627" y="232" text-anchor="middle" fill="#c0a0e8" font-size="9">list</text>
  <text x="627" y="252" text-anchor="middle" fill="#a870d0" font-size="9" font-style="italic">→ danger signal</text>

  <!-- Arrows from four boxes down to combiner -->
  <line x1="117" y1="264" x2="117" y2="296" stroke="#58a6ff" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3"/>
  <line x1="287" y1="264" x2="287" y2="296" stroke="#58a6ff" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3"/>
  <line x1="457" y1="264" x2="457" y2="296" stroke="#58a6ff" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3"/>
  <line x1="627" y1="264" x2="627" y2="296" stroke="#58a6ff" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3"/>

  <!-- Combiner horizontal line -->
  <line x1="117" y1="296" x2="627" y2="296" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="372" y1="296" x2="372" y2="322" stroke="#58a6ff" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>

  <!-- Importance Weighting box -->
  <rect x="220" y="322" width="310" height="48" fill="#161b22" rx="8" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
  <text x="375" y="342" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="bold" letter-spacing="2">IMPORTANCE WEIGHTING</text>
  <text x="375" y="358" text-anchor="middle" fill="#8b949e" font-size="9">high priority → weight 10 · medium → 5 · low → 2</text>

  <!-- Arrow to summary -->
  <line x1="375" y1="370" x2="375" y2="396" stroke="#58a6ff" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>

  <!-- WHY Summary output -->
  <rect x="100" y="396" width="550" height="72" fill="url(#decisionGrad)" rx="10" stroke="#58a6ff" stroke-width="2" filter="url(#glow)" opacity="0.95"/>
  <text x="375" y="420" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" letter-spacing="2">WHY SUMMARY (Dynamic Output)</text>
  <text x="375" y="440" text-anchor="middle" fill="#cce8ff" font-size="9.5" font-style="italic">"'Overtake' advances progress toward faster arrival on highway.</text>
  <text x="375" y="454" text-anchor="middle" fill="#cce8ff" font-size="9.5" font-style="italic"> Moderate failure probability (35%). Valid when visibility is good."</text>

  <!-- Attribution -->
  <text x="380" y="506" text-anchor="middle" fill="#484f58" font-size="8" letter-spacing="1">CDRS · Sami Ahmed Yusuf Kolarkar, 2026 · Apache 2.0</text>
</svg>
